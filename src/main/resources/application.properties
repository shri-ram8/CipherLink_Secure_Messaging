# ── Load local .env file as a properties source ────────────
# (optional: so it does NOT break on platforms like Render/Railway where
# real env vars are injected directly and no .env file exists)
spring.config.import=optional:file:.env[.properties]

# ── Server ────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL / Supabase ─────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=120000

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
jwt.key=${JWT_SECRET_KEY}
jwt.issuer=CipherLink
jwt.audience=CipherLinkApp
jwt.access-token-expiry-minutes=60
jwt.refresh-token-expiry-days=30

# ── Firebase ──────────────────────────────────────────────
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# ── Media / Supabase Storage ──────────────────────────────
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=cipherlink-media

# ── Media (local disk) ──────────────────────────────────────
media.stories-path=${MEDIA_STORIES_PATH:./media/stories}

# ── CORS ──────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Link Preview ──────────────────────────────────────────
link.preview.timeout-ms=3000

# ── SpringDoc / Swagger ───────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ───────────────────────────────────────────────
logging.level.com.cipherlink=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN